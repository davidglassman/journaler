# Security-only Dependabot.
# open-pull-requests-limit: 0 disables version updates; Dependabot security
# updates (repo Setting → Code security) still open PRs for vulnerabilities.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
